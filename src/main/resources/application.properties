# ===========================
# SERVER
# ===========================
server.port=8080

# ===========================
# POSTGRESQL DATABASE
# ===========================
spring.datasource.url=jdbc:postgresql://localhost:5432/calendly_lite
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# ===========================
# JPA / HIBERNATE
# ===========================
# 'validate' = Hibernate checks schema matches entities (Flyway manages actual creation)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Dialect is intentionally omitted — Hibernate 6 auto-detects PostgreSQL from the datasource URL
spring.jpa.open-in-view=false

# ===========================
# FLYWAY (DB MIGRATIONS)
# ===========================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ===========================
# REDIS
# ===========================
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ===========================
# CACHE (backed by Redis)
# ===========================
spring.cache.type=redis
# Cache TTL: 5 minutes (300,000 ms)
spring.cache.redis.time-to-live=300000

# ===========================
# SWAGGER / OPENAPI
# ===========================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ===========================
# SCHEDULING (Outbox Worker)
# ===========================
spring.task.scheduling.pool.size=5

# ===========================
# LOGGING
# ===========================
logging.level.com.hackathon=DEBUG
logging.level.org.flywaydb=INFO
